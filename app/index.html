<body>
    <div class="large-hero">

        <picture>
            <source srcset="assets/images/hero-section/hero--large.jpg 1920w,
            assets/images/hero-section/hero--large-hi-dpi.jpg 3840w" media="(min-width:1200px)">
            <source srcset="assets/images/hero-section/hero--medium.jpg 1380w,
            assets/images/hero-section/hero--medium-hi-dpi.jpg 2760w" media="(min-width:992px)">
            <source srcset="assets/images/hero-section/hero--small.jpg 990w,
            assets/images/hero-section/hero--small-hi-dpi.jpg 1980w" media="(min-width:768px)">
            <img srcset="assets/images/hero-section/hero--smaller.jpg 640w, assets/images/hero-section/hero--smaller-hi-dpi.jpg 1980w">
        </picture>

        <!-- <img src="assets/images/hero-section/hero--large.jpg" alt=""> -->
        <div class="large-hero__shadow"></div>
        <div class="large-hero__text-content">
            <h1 class = "large-hero__title">Interior Design New York</h1>
            <p class="large-hero__description">
                All of our design are aimed at giving interior a soul. People must be able to feel experience spaces.
            </p>
            <a href = "#" class="custom-btn custom-btn__transparent">GET INSPIRED</a>
        </div>
    </div>
    <script src="./app.bundled.js"></script>
